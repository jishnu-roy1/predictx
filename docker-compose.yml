  #     - postgres
  #   env_file:
  #     - .env
  #   command: ["npm", "run", "bull-ui"]
  #   ports:
  #     - "8082:8082"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: jishnu.roy@gmail.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin


version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: redis

    restart: always

    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: ./api/dockerfile

    container_name: express-api

    restart: always

    depends_on:
      - postgres
      - redis

    ports:
      - "3000:3000"

    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: ./worker/dockerfile

    container_name: bull-worker

    restart: always

    depends_on:
      - redis
      - postgres

    env_file:
      - .env

volumes:
  postgres_data: